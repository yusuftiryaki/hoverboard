# Every job is one call to scripts/ci.sh — the logic lives there, so it can be
# run in the dev container. This file only decides WHERE each stage runs.
#
#   unit, firmware   bare runner. Neither needs ROS, and `unit` exists to prove
#                    exactly that.
#   stack/nav2/gazebo  inside the image built from .devcontainer/Dockerfile —
#                    not a package list repeated here. A package that was
#                    apt-installed by hand in someone's container and never made
#                    it into the Dockerfile fails here instead of passing
#                    everywhere except after the next rebuild.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # build-push-action otherwise attaches a build-record artifact to every
  # run, which buries the logs that matter.
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          cache-from: type=gha,scope=devcontainer
          cache-to: type=gha,scope=devcontainer,mode=max

  exp:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          load: true
          tags: hoverboard-dev:ci
          cache-from: type=gha,scope=devcontainer
      - run: chmod -R a+rwX .
      - run: >
          docker run --rm --network=host
          -v "$PWD:/workspaces/hoverboard" -w /workspaces/hoverboard
          -e ROS_LOG_DIR=/workspaces/hoverboard/ros2/log/ci/ros
          hoverboard-dev:ci ./scripts/exp_ekf_startup.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exp-ekf-startup
          path: ros2/log/ci
          retention-days: 7
