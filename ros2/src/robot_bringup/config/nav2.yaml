# Nav2 — GPS waypoint following in open ground (roadmap A2 / old step 6).
#
# ⚠️⚠️ READ THIS FIRST: THE COSTMAPS ONLY KNOW WHAT THEY WERE TOLD.
#
# This robot has NO range sensor. No LIDAR (handoff decision 3: cheap 2D lidar is
# useless in sunlight), no ultrasonics (dropped from the design on 2026-10-08,
# handoff decision 8), no depth camera. Nothing OBSERVES an obstacle, so nothing ever appears in a costmap at
# runtime.
#
# What the costmaps DO hold, since A3c, is an A PRIORI map: a static_layer fed
# from /obstacle_map, carrying obstacles someone surveyed in advance in the same
# datum the GPS reports. Nav2 plans around those, and that avoidance is real —
# measured against ground truth in test_nav2.py: a 2.00 m detour around a wall,
# where the same goal with no wall deviates 0.29 m.
#
# But an UNSURVEYED obstacle is still invisible. Nav2 will drive through a tree
# nobody entered into the map, with total confidence. The only thing between the
# robot and a surprise is the ESP32's bumper reflex — contact, not avoidance.
# Seeing obstacles rather than remembering them needs a sensor, and the only
# one left in the plan is the camera (ground segmentation -> a costmap layer,
# not written yet). Inventory note in wiring-map section 6.
#
# This is coherent with the mission the hardware actually supports (decision 5):
# open field, wide corridors, 2.5-5 m GPS. It is NOT "drive to the shop".
#
# Frames: map -> odom comes from ekf_global + navsat_transform, odom -> base_link
# from ekf_local. Nav2 plans in `map`, so use_gps:=true is REQUIRED — without it
# nothing publishes map->odom and Nav2 will sit there waiting for a transform.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    # NOT /odom. That topic is raw wheel dead reckoning, which drifts without
    # bound; the EKF's output is what everything else in this stack believes.
    odom_topic: /odometry/filtered/local
    bt_loop_duration: 10
    # ⚠️ 1000 ms, not Nav2's default 20. This is how long the BT waits for an
    # action server to ACKNOWLEDGE a goal, and 20 ms assumes a workstation. The
    # planner missed it here — on a loaded 4-core box NavFn could not ack in
    # time, so a waypoint the robot had physically reached was reported as
    # failed. The Pi 4 is slower than this container, not faster.
    default_server_timeout: 1000
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    # Differential drive: y velocity is not just small, it is impossible.
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odometry/filtered/local
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      # Generous: GPS wanders by metres, so a robot that is genuinely moving can
      # briefly look stuck. A tight window here would abort good missions.
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Loose on purpose: the GPS wanders by metres, so map->odom shifts under
      # the robot. A tight tolerance would have it forever chasing a goal that
      # keeps moving in its own estimate.
      #
      # ⚠️ BUT IT CANNOT EXCEED THE LOOKAHEAD DISTANCE. RPP asks "am I at the
      # goal?" by comparing the distance to its LOOKAHEAD POINT against this
      # value. Set it above min_lookahead_dist and the carrot — always ~a
      # lookahead ahead — is permanently "within the goal", so RPP locks into
      # rotate-to-goal-heading, commands zero linear velocity forever, and the
      # robot sits and jiggles while the BT eventually reports "failed to make
      # progress". It looks exactly like a broken controller.
      # This cost real debugging time here; 1.5 m against a 0.4 m lookahead did
      # precisely that. Keep this < min_lookahead_dist below.
      xy_goal_tolerance: 1.0
      # Heading at the goal is not meaningful for a waypoint mission, and with no
      # magnetometer the absolute yaw is drifting anyway (decision 4).
      yaw_goal_tolerance: 3.14
      stateful: true

    FollowPath:
      # Rotation shim + Regulated Pure Pursuit.
      #
      # Why not DWB/MPPI: those exist to dodge obstacles in clutter, by scoring
      # trajectories against a costmap that sensors keep changing. Ours holds a
      # surveyed map and nothing else — nothing new appears at runtime, so the
      # global plan already routes around everything that is known and the
      # controller's only job is to hold that plan. They would burn CPU choosing
      # between paths that differ by nothing.
      #
      # RPP just follows the line, which is the whole job here.
      #
      # Why the shim: a differential drive robot cannot strafe. Facing 90 degrees
      # from the path, RPP would carve a long arc; the shim rotates in place
      # first, then hands over. It is what makes a diff-drive robot look sane.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785        # 45 deg: rotate first beyond this
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.0
      simulate_ahead_time: 1.0

      # ⚠️ These speeds are LOW ON PURPOSE and pair with the firmware's
      # SPEED_LIMIT=300. Raise both together, and only after the robot has proven
      # on real ground that it stops when told to (roadmap B4/B5).
      desired_linear_vel: 0.5
      # ⚠️ min_lookahead_dist MUST stay above the goal checker's
      # xy_goal_tolerance (1.0) — see the warning there. The carrot never comes
      # closer than this, so it never looks like the goal until the plan itself
      # runs out near the real goal, which is exactly when it should.
      # 1.2 m at 0.5 m/s is ~2.4 s of lookahead: long enough to cut corners, but
      # this robot follows straight lines across open ground, so there are no
      # corners worth preserving.
      lookahead_dist: 1.5
      min_lookahead_dist: 1.2
      max_lookahead_dist: 2.5
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false               # casters do not steer backwards well
      use_rotate_to_heading: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      # ⚠️ ON since A3c. It was off while the costmap was permanently empty:
      # checking the robot against free space passes every time, and a check
      # that cannot fail is worse than no check, because it reads like one.
      # The static layer now carries a real map, so this becomes a genuine last
      # line of defence — if the path ahead would drive into a surveyed
      # obstacle, RPP stops and lets the BT replan instead of grinding into it.
      # It still sees NOTHING unsurveyed.
      use_collision_detection: true
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      transform_tolerance: 0.2

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # A circle around the 0.60 x 0.40 m deck. Circular rather than a polygon
      # footprint: the chassis does not exist yet (B3), so a precise outline
      # would be false precision.
      robot_radius: 0.4
      # A3c: the static layer carries the a priori obstacle map, inflation
      # grows it by the robot radius. Order matters — inflation reads whatever
      # the layers before it wrote.
      # ⚠️ This costmap's global_frame is `odom` while the map arrives in `map`,
      # so the layer transforms it every update and needs map->odom to exist.
      # ekf_global publishes it on the real stack; the Nav2 tests pin it to
      # identity. With neither, the layer stays empty rather than erroring.
      # (A note kept from before A3c: `plugins: []` is not expressible — an
      # empty YAML list loses its type and rclcpp aborts with "No parameter
      # value set". Still true, so the list must never shrink to nothing.)
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # sim_node's a priori obstacle map (frame `map`, surveyed in the navsat
        # datum — see sim_node._publish_obstacle_map). NOT /map: nothing here
        # runs a SLAM or map_server, and pointing at /map would leave the layer
        # waiting for a publisher that never appears, silently, forever.
        map_topic: /obstacle_map
        # ⚠️ The map is latched once at startup and never republished. Without
        # transient_local durability a costmap that configures later never
        # receives it and plans through the obstacle — green logs, no error.
        map_subscribe_transient_local: true
        # No incremental map updates: obstacles do not move in this world.
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # ⚠️ Retuned in A3c, the first time these costmaps ever held an
        # obstacle. It was 0.55 (robot_radius + 0.15) with a scaling of 3.0,
        # and that is not enough clearance for THIS controller: RPP with a
        # 1.5 m lookahead deliberately cuts corners (see its own note below),
        # so it drives inside the planned path on a turn. Measured with the old
        # values: NavFn routed around a wall, RPP cut the corner, and the robot
        # jammed against the wall tip at exactly the 0.70 m contact distance —
        # while Nav2 reported SUCCEEDED, because a stuck robot's wheels keep
        # spinning and odometry keeps advancing.
        # So the margin has to cover the controller's cutting, not just the
        # robot's body. 1.0 m of inflation with a gentler gradient (2.0 spreads
        # the cost further out than 3.0, which decays almost to nothing within
        # half a metre) pushes the planned path wide enough that the cut still
        # clears. This is tuned against a simulated world; recheck it on the
        # real robot at B7.
        cost_scaling_factor: 2.0
        inflation_radius: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # Rolling, not static: there is no map of a field, and none is needed for
      # straight lines between GPS points.
      rolling_window: true
      # ⚠️ 60 x 60 m, so ±30 m around the robot. A goal outside this window
      # cannot be planned to — a long route needs intermediate waypoints, which
      # the rolling window then carries along.
      # It was 100 x 100 at 0.1 m = ONE MILLION cells, and NavFn sweeps all of
      # them every replan. That starved the planner on 4 cores and made it miss
      # the BT's ack deadline. The Pi 4 has less to give, not more.
      width: 60
      height: 60
      # 0.1 m, coarser than the local costmap: it spans 100 m and its only job is
      # to hold a straight line. 0.05 would quadruple the cells for nothing.
      resolution: 0.1
      robot_radius: 0.4
      # A3c: this is the layer NavFn actually plans around. The rolling window
      # is 60 x 60 m and sim_node's map is the same 60 x 60 m fixed at the
      # origin, so they coincide at startup and the window slides off the map's
      # edge only past ~30 m from origin — beyond which cells read as free,
      # not as obstacles. Long routes need intermediate waypoints anyway.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # sim_node's a priori obstacle map (frame `map`, surveyed in the navsat
        # datum — see sim_node._publish_obstacle_map). NOT /map: nothing here
        # runs a SLAM or map_server, and pointing at /map would leave the layer
        # waiting for a publisher that never appears, silently, forever.
        map_topic: /obstacle_map
        # ⚠️ The map is latched once at startup and never republished. Without
        # transient_local durability a costmap that configures later never
        # receives it and plans through the obstacle — green logs, no error.
        map_subscribe_transient_local: true
        # No incremental map updates: obstacles do not move in this world.
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Same values as the local costmap, same reason — see the note there.
        cost_scaling_factor: 2.0
        inflation_radius: 1.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      # NavFn over a costmap that is free space except for the surveyed map:
      # straight lines where nothing is known, a route around what is. Both are
      # the right plan. Smac/Hybrid-A* would buy kinematic feasibility we do not
      # need from a differential drive that can turn in place.
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # Loose, to match the goal checker and the GPS's real accuracy.
      tolerance: 1.0
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    # ⚠️ These recoveries move the robot nearly BLIND: they shake loose from
    # what the costmap knows, and it knows only the surveyed map — never the
    # thing the robot actually bumped into. Backing up on contact is the ESP32
    # bumper's job, not this. Kept for the BT's sake, kept slow.
    max_rotational_vel: 0.6
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    # false: one bad waypoint should not abandon the mission. In an open field
    # the usual cause is a GPS wobble, and the next waypoint is often fine.
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      # Let the GPS settle before the next leg is planned from this position.
      waypoint_pause_duration: 2000

# SP4: opennav_docking — the last two metres onto the charging contacts.
#
#   battery_supervisor: NavigateToPose(staging) -> Spin(face dock) -> DockRobot
#   docking_server:     marker -> dock pose -> graceful controller -> contacts
#                       -> "charging" = /battery current > charging_threshold
#
# The staging and turning are the supervisor's, not this server's: its own
# staging navigation would use the loose goal checker above (1.0 m, any
# heading) and then fail its initial perception — without retrying — whenever
# the robot arrived facing away from the marker.
docking_server:
  ros__parameters:
    controller_frequency: 20.0
    # How long the marker may take to show up once staged and turned.
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    # The dock pose is tracked in odom, NOT map: map->odom jumps with every GPS
    # fix, and a dock that jumps metres mid-approach is not a dock you reach.
    fixed_frame: odom
    # Forward: the camera is at the front and has to see the marker.
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    # dock_database is set by nav2.launch.py (config/docks.yaml by default).
    dock_plugins: ["charging_dock"]
    charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      # The marker (image_proc track_marker_node -> detected_dock_pose) steers
      # the approach; the database pose only says where to look.
      use_external_detection_pose: true
      external_detection_timeout: 1.0
      # The marker is 0.55 m AHEAD of the docked base_link (the station:
      # robot_sim/dock_model.py; SP6 builds the real one — CALIBRATE).
      external_detection_translation_x: -0.55
      external_detection_translation_y: 0.0
      # These undo the aruco/AprilTag marker convention (z out of the marker,
      # y up). Nav2's defaults, written to 4 digits instead of 1.57: 0.0008 rad
      # of yaw error across 0.55 m is half a millimetre, but it is free to fix.
      external_detection_rotation_roll: -1.5708
      external_detection_rotation_pitch: 1.5708
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
      # Docked = /battery says current is flowing IN. Without an INA228
      # battery_monitor publishes NaN current and docking ends in
      # FAILED_TO_CHARGE: SP4 needs the current sensor (design decision).
      use_battery_status: true
      charging_threshold: 0.5
      use_stall_detection: false
      # The approach also stops this close to the detected dock pose — the
      # spring contacts close over the last ~6 cm (CALIBRATE with SP6).
      docking_threshold: 0.05
      # Staging 1.5 m out: near enough for a 10 cm marker to decode, far enough
      # that a survey error of the dock database is still in view.
      staging_x_offset: -1.5
      staging_yaw_offset: 0.0
    controller:
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.4
      lambda: 2.0
      # Slow on the final approach: 0.15 m/s into spring contacts.
      v_linear_min: 0.05
      v_linear_max: 0.15
      v_angular_max: 0.5
      slowdown_radius: 0.25
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.2
      projection_time: 3.0
      simulation_time_step: 0.1
      # ⚠️ 0.5, not Nav2's 0.3. The station is on the survey map (it has to
      # be: docks.yaml), and docking ENDS with the robot touching it — so the
      # projected approach collides with the station's own cells near the end.
      # MEASURED at 0.3 (test_docking_sweep): "Collision detected at (3.99,
      # 0.00)" one centimetre short of the dock, FAILED_TO_CONTROL after 4
      # retries, in 7 of 11 approaches. 0.5 ignores poses in the last ~25 cm
      # before the dock pose: nothing but the station can be surveyed there.
      dock_collision_threshold: 0.5
