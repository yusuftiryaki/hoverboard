# INA228 is optional until the sensor is installed.
battery_monitor:
  ros__parameters:
    i2c_bus: 1
    address: 0x40
    rate_hz: 10.0
    # The board in hand carries its own shunt, marked R002 = 2 milliohm
    # (read off the part, 2026-10-08) — no external shunt in this design.
    # With the driver's +/-163.84 mV range that is +/-81.9 A full scale, and at
    # the 20 A the fuse allows the resistor dissipates 0.8 W.
    # Still CALIBRATE: the marking is nominal, and the board's own traces and
    # terminals have not been checked for carrying pack current.
    shunt_ohms: 0.002
    # CALIBRATE so discharge is negative per BatteryState convention.
    invert_current: false
    # CALIBRATE by measuring a full discharge cycle.
    capacity_ah: 4.4
    cells: 10
    full_voltage_per_cell: 4.15
    taper_current_a: 0.3
    full_hold_s: 30.0
    init_window_s: 5.0

# SP5: low battery -> cancel the mission, go home, dock, charge
# (battery_manager/supervisor_policy.py). Launched with Nav2 (nav2.launch.py).
battery_supervisor:
  ros__parameters:
    # CALIBRATE on the real pack (design doc: DÖN ~25 %, KRİTİK ~10 %). The
    # gap between them is the energy budget for the trip home — "eve
    # yetişemedi" is an accepted v1 risk, and this gap is where it lives.
    return_soc: 0.25
    critical_soc: 0.10
    # Fallback without an INA228 (percentage NaN): per-cell volts on a slow
    # filter, conservative on purpose. CALIBRATE.
    return_cell_v: 3.50
    critical_cell_v: 3.30
    cells: 10
    debounce_s: 3.0
    voltage_filter_s: 30.0
    stale_s: 5.0
    # = nav2.yaml docking_server charging_dock.charging_threshold
    charging_current_a: 0.5
    charge_lost_s: 10.0
    dock_id: home
    dock_type: charging_dock
    # = -staging_x_offset of nav2.yaml's charging_dock (test_docking_config).
    staging_distance: 1.5
    max_staging_time_s: 300.0
